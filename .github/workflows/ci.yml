name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same branch on every new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick feedback loop: static checks + short tests. No cross-compile,
  # no network. Target ≤ 2 min.
  test:
    name: vet + test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Static checks
        run: go vet ./...
      - name: Short tests
        run: go test -short -race ./internal/...

  # Slow path: cross-compile every platform the radar runs on. Skipped
  # for draft PRs to save minutes; the release workflow runs it again
  # on tag push.
  #
  # The matrix uses explicit goos/goarch fields (not slash-separated
  # strings): the GitHub Actions expression language only supports
  # contains/startsWith/endsWith/format/join/toJSON/fromJSON/hashFiles,
  # so things like ${{ matrix.platform.replace('/', '-') }} silently
  # evaluate to "" and the artifact path collapses. Two named fields
  # sidestep the issue and produce a clean artifact name.
  build:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 \
            go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o dist/radar-$GOOS-$GOARCH ./cmd/radar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/radar-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
