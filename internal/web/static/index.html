<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signets — Personal Radar</title>
  <style>
    /* ---------- base ---------- */
    :root {
      --bg: #0b0d10;
      --panel: #12151a;
      --panel-2: #1a1f26;
      --border: #20262e;
      --text: #e6e9ee;
      --muted: #98a1ad;
      --accent: #4f8ff7;
      --danger: #e5484d;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* ---------- header ---------- */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11, 13, 16, 0.92);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top));
      display: flex; flex-direction: column; gap: 9px;
    }
    .header-top { display: flex; align-items: center; gap: 8px; }
    .header-top h1 {
      font-size: 15px; font-weight: 600; margin: 0; flex: 1;
      letter-spacing: 0.01em;
      display: flex; align-items: center; gap: 8px;
      min-width: 0;
    }
    .header-top h1 span { color: var(--muted); font-weight: 400; }
    /* floating mark-all-read button, centered at the bottom of the screen */
    #readall {
      position: fixed;
      bottom: calc(22px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-2);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 11px 22px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 7px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    #readall::before { content: "✓"; font-weight: 700; }
    #readall:hover { color: var(--text); border-color: var(--accent); background: #222936; }
    #readall:active { transform: translateX(-50%) scale(0.97); }
    #refresh {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 12px; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    #refresh:active { background: var(--panel-2); color: var(--text); }
    /* mobile: icon-only refresh */
    .refresh-label { display: none; }

    /* filtres = segmented control */
    .filters {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 3px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 3px;
    }
    .filters button {
      background: transparent; color: var(--muted); border: 0;
      padding: 8px 0; border-radius: 8px; font-size: 13px; font-weight: 500;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .filters button.active {
      background: var(--panel-2); color: var(--text);
    }

    /* tagbar: category chips with per-tag counts (horizontal scroll) */
    .tagbar {
      display: flex; gap: 6px;
      overflow-x: auto; padding: 2px 1px 3px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .tagbar::-webkit-scrollbar { display: none; }
    .tagbar .tag { white-space: nowrap; }
    .tagbar .tag .count { opacity: 0.65; margin-left: 3px; font-weight: 500; }

    /* ---------- liste ---------- */
    main { max-width: 1320px; margin: 0 auto; padding: 12px 14px calc(96px + env(safe-area-inset-bottom)); }
    .summary { color: var(--muted); font-size: 12.5px; margin: 2px 2px 12px; }

    .card {
      display: flex; flex-direction: column; gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 14px 12px;
      margin-bottom: 9px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card.liked { border-color: rgba(229, 72, 77, 0.35); }
    /* uniform footer alignment: push tags+footer to the bottom of the card */
    .tags { margin-top: auto; padding-top: 6px; }
    .card-foot { margin-top: auto; }
    @media (min-width: 640px) {
      .card:hover {
        transform: translateY(-2px);
        border-color: #2e3642;
      }
    }

    /* description: AI title (clickable) + bullet list */
    .sum-title {
      color: #e6edf3; font-size: 15.5px; line-height: 1.4;
      font-weight: 600; text-decoration: none;
      max-width: 100%;
      transition: color 0.12s;
    }
    a.sum-title:hover { color: var(--accent); }
    .sum-title.loading { color: #6b7480; font-style: italic; font-weight: 400; }
    .sum-points {
      margin: 6px 0 0; padding: 0 0 0 18px;
      color: #c8cfd9; font-size: 13.5px; line-height: 1.5;
      list-style: disc;
    }
    .sum-points li { margin-bottom: 3px; }
    .sum-points.loading { visibility: hidden; }
    .card-summary { display: flex; flex-direction: column; gap: 0; }

    /* tags: chips on the card */
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      line-height: 1.3;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tag:hover { color: var(--text); border-color: var(--accent); }
    .tag.active {
      background: var(--accent); border-color: var(--accent);
      color: white; font-weight: 600;
      box-shadow: 0 0 0 1px rgba(79,143,247,0.25);
    }
    .card.filtered-out { display: none; }

    /* footer: meta (source · date) left, actions right */
    .card-foot {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: auto; padding-top: 9px;
      border-top: 1px solid var(--border);
    }
    .meta {
      color: var(--muted); font-size: 12px;
      display: flex; align-items: center; gap: 5px;
      min-width: 0;
    }
    .meta .dot { color: #3a4350; }
    .meta .src-icon { font-size: 12px; }
    .meta .src { font-weight: 500; color: #b9c1cc; }

    .actions { display: flex; gap: 6px; margin-left: auto; }
    .actions button {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 14px; font-size: 12px; cursor: pointer;
      min-height: 34px; -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; gap: 5px;
    }
    .actions button:active { background: var(--panel-2); }
    .actions button.like { color: var(--accent); border-color: rgba(79,143,247,0.35); }
    .actions button.liked { color: #e5484d; border-color: rgba(229,72,77,0.45); }

    .empty { text-align: center; color: var(--muted); padding: 70px 20px; font-size: 14px; }
    .empty small { display: block; margin-top: 6px; color: #5d6672; }

    .toast {
      position: fixed; bottom: calc(76px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 18px; font-size: 13px;
      opacity: 0; pointer-events: none; transition: opacity 0.18s;
      white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
      z-index: 21;
    }
    .toast.show { opacity: 1; }

    /* ---------- desktop ---------- */
    @media (min-width: 640px) {
      body { font-size: 15px; }
      header { padding: 12px 24px 10px; flex-direction: row; align-items: center; gap: 16px; flex-wrap: wrap; }
      header .filters { width: 300px; order: 2; }
      header .tagbar { order: 3; width: 100%; }
      .header-top { flex: 1; }
      .refresh-label { display: inline; }
      main { padding: 20px 24px 60px; }
      #list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 14px;
        align-items: start;
      }
      .card { margin-bottom: 0; }
      .sum-title:hover { color: #bcc5d0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Signets <span id="count"></span></h1>
      <button id="refresh" title="Rafraîchir" onclick="load()">↻ <span class="refresh-label">Rafraîchir</span></button>
    </div>
    <div class="filters">
      <button data-filter="unread" class="active">Non lus</button>
      <button data-filter="liked">Likés</button>
      <button data-filter="all">Tous</button>
    </div>
    <div class="tagbar" id="tagbar" hidden></div>
  </header>
  <main>
    <div id="list"><div class="empty">Chargement…</div></div>
  </main>
  <button id="readall" title="Marquer tout comme lu" onclick="markAllRead()">Tout marquer lu</button>
  <div id="toast" class="toast"></div>
  <script>
    const SOURCE_ICON = { github: "🐙", x: "🐦", reddit: "🔴", "reddit-public": "🔴", rss: "📰", linkedin: "💼" };
    const SOURCE_LABEL = { github: "GitHub", x: "X", reddit: "Reddit", "reddit-public": "Reddit", rss: "Flux RSS", linkedin: "LinkedIn" };
    const FILTER_LABEL = { unread: "non lus", liked: "likés", all: "tous" };
    // French labels for the category chips
    const TAG_LABEL = {
      "coding-agents": "agents de code",
      "software-engineering": "génie logiciel",
      "open-source": "open source",
      "ai": "IA",
      "devops": "DevOps",
      "go": "Go",
      "cluster": "cluster",
      "llm": "LLM",
      "agents": "agents",
      "infra": "infra",
      "rust": "Rust",
      "python": "Python",
      "security": "sécurité",
      "data": "data",
      "web": "web",
      "mobile": "mobile",
    };
    let currentFilter = "unread";
    let activeTag = null;

    async function fetchJSON(url, opts) {
      const r = await fetch(url, opts);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    function fmtTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "à l'instant";
      if (diff < 3600) return `il y a ${Math.floor(diff / 60)} min`;
      if (diff < 86400) return `il y a ${Math.floor(diff / 3600)} h`;
      if (diff < 86400 * 7) return `il y a ${Math.floor(diff / 86400)} j`;
      return d.toLocaleDateString("fr-FR");
    }

    function hostname(u) {
      try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
    }

    function escape(s) {
      return (s || "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function renderItem(b) {
      const icon = SOURCE_ICON[b.source] || "•";
      const srcLabel = SOURCE_LABEL[b.source] || b.source;
      const url = b.url || b.canonical_url || "#";
      const dom = hostname(url);
      const topics = b.topics || [];
      const card = document.createElement("div");
      card.className = "card" + (b.is_liked ? " liked" : "");
      card.dataset.tags = topics.join("|");
      card.dataset.read = b.is_read ? "1" : "0";
      // show up to 3 chips (the ingestion pipeline now guarantees 3 tags)
      const chips = topics.slice(0, 3);
      const rest = topics.length - 3;
      card.innerHTML = `
        <div class="card-summary" id="summary-${b.id}">
          <a class="sum-title loading" id="title-${b.id}" href="${escape(url)}" target="_blank" rel="noopener">Résumé…</a>
          <ul class="sum-points loading" id="points-${b.id}"></ul>
        </div>
        ${chips.length ? `<div class="tags">${chips.map(t => `<button class="tag" data-tag="${escape(t)}">${escape(TAG_LABEL[t] || t)}</button>`).join("")}${rest > 0 ? `<span class="tag">+${rest}</span>` : ""}</div>` : ""}
        <div class="card-foot">
          <div class="meta">
            <span class="src-icon">${icon}</span>
            <span class="src">${escape(dom || srcLabel)}</span>
            <span class="dot">·</span>
            <span>${fmtTime(b.collected_at)}</span>
          </div>
          <div class="actions">
            ${b.is_liked
              ? `<button class="liked" data-action="unlike" data-id="${b.id}">♥ Liké</button>`
              : `<button class="like" data-action="like" data-id="${b.id}">♡ Like</button>`}
          </div>
        </div>
      `;
      return card;
    }

    async function loadSummary(id) {
      const titleEl = document.getElementById(`title-${id}`);
      const pointsEl = document.getElementById(`points-${id}`);
      try {
        const data = await fetchJSON(`/api/summary/${id}`);
        const pts = (data.points && data.points.length) ? data.points : (data.summary ? [data.summary] : []);
        if (titleEl) {
          titleEl.classList.remove("loading");
          // title if present, else first point doubles as the clickable head
          titleEl.textContent = data.title ? data.title : (pts[0] || "—");
        }
        if (pointsEl) {
          pointsEl.classList.remove("loading");
          const bullets = data.title ? pts : pts.slice(1);
          pointsEl.innerHTML = bullets.map(p => `<li>${escape(p)}</li>`).join("");
        }
      } catch (e) {
        if (titleEl) {
          titleEl.classList.remove("loading");
          titleEl.textContent = "Résumé indisponible";
        }
      }
    }

    // tagbar: top categories among the loaded items, each with a count.
    function renderTagBar(items) {
      const bar = document.getElementById("tagbar");
      const counts = {};
      items.forEach(b => (b.topics || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
      if (!sorted.length) { bar.hidden = true; bar.innerHTML = ""; return; }
      bar.hidden = false;
      bar.innerHTML = sorted.map(([t, c]) =>
        `<button class="tag" data-tag="${escape(t)}">${escape(TAG_LABEL[t] || t)} <span class="count">${c}</span></button>`
      ).join("");
    }

    function applyTagFilter() {
      const cards = document.querySelectorAll(".card");
      cards.forEach(c => {
        const tags = (c.dataset.tags || "").split("|");
        const show = !activeTag || tags.includes(activeTag);
        c.classList.toggle("filtered-out", !show);
      });
      document.querySelectorAll(".tag").forEach(t => t.classList.toggle("active", t.dataset.tag === activeTag));
    }

    let lastItems = []; // items of the last load(), used to patch tags/counts locally

    // Optimistic like/unlike: patch the card in place instead of reloading
    // the whole list (which re-fetches summaries and makes the page jump).
    function applyLikeLocal(id, liked) {
      // find the card by its like button
      const btn = document.querySelector(`button[data-action][data-id="${id}"]`);
      const cardEl = btn ? btn.closest(".card") : null;
      if (!cardEl) { load(); return; }
      const item = lastItems.find(b => b.id === id);
      // 1) update the like button + card state
      cardEl.classList.toggle("liked", liked);
      cardEl.dataset.read = "1";
      const oldBtn = cardEl.querySelector("button[data-action]");
      if (oldBtn) {
        oldBtn.classList.remove("like", "liked");
        oldBtn.classList.add(liked ? "liked" : "like");
        oldBtn.dataset.action = liked ? "unlike" : "like";
        oldBtn.textContent = liked ? "♥ Liké" : "♡ Like";
      }
      // 2) like in the "unread" view removes the card (item becomes read);
      //    unlike in the "liked" view removes it too. Animate the height so
      //    the grid reflows smoothly instead of jumping.
      const leaves = (currentFilter === "unread" && liked) || (currentFilter === "liked" && !liked);
      if (leaves) {
        const h = cardEl.offsetHeight;
        cardEl.style.transition = "height 220ms ease, opacity 220ms ease, margin 220ms ease, padding 220ms ease";
        cardEl.style.overflow = "hidden";
        cardEl.style.padding = "0 14px";
        cardEl.style.height = h + "px";
        requestAnimationFrame(() => {
          cardEl.style.height = "0px";
          cardEl.style.opacity = "0";
          cardEl.style.marginBottom = "0px";
        });
        setTimeout(() => {
          cardEl.remove();
          // keep tagbar counts + totals consistent with what's left
          if (item) {
            const idx = lastItems.indexOf(item);
            if (idx >= 0) lastItems.splice(idx, 1);
            renderTagBar(lastItems);
          }
          const totalEl = document.getElementById("count");
          const cur = totalEl.textContent.replace(/[^\d]/g, "");
          totalEl.textContent = cur ? `· ${parseInt(cur, 10) - 1}` : "";
          const listEl = document.getElementById("list");
          if (listEl && !listEl.children.length) {
            listEl.innerHTML = `<div class="empty">Rien à afficher<small>Le prochain briefing alimentera cette liste.</small></div>`;
            document.getElementById("readall").style.display = "none";
          }
          applyTagFilter();
        }, 240);
      } else {
        // like also marks as read (server does it); update the FAB if needed
        if (liked && currentFilter === "all") {
          const unreadLeft = lastItems.some(b => b.id !== id && !b.is_read);
          document.getElementById("readall").style.display = unreadLeft ? "" : "none";
        }
      }
    }

    async function load() {
      const list = document.getElementById("list");
      const count = document.getElementById("count");
      try {
        const data = await fetchJSON(`/api/bookmarks?filter=${currentFilter}&limit=100`);
        lastItems = data.items || [];
        count.textContent = data.total ? `· ${data.total}` : "";
        // "tout lu" only makes sense when there is something left to read
        const unreadLeft = currentFilter === "unread"
          ? data.total > 0
          : currentFilter === "all" && data.items.some(b => !b.is_read);
        document.getElementById("readall").style.display = unreadLeft ? "" : "none";
        renderTagBar(data.items);
        if (!data.items.length) {
          list.innerHTML = `<div class="empty">Rien à afficher<small>Le prochain briefing alimentera cette liste.</small></div>`;
          return;
        }
        list.innerHTML = "";
        const frag = document.createDocumentFragment();
        for (const b of data.items) frag.appendChild(renderItem(b));
        list.appendChild(frag);
        for (const b of data.items) loadSummary(b.id);
        applyTagFilter(); // re-apply in case a tag filter is active
      } catch (e) {
        list.innerHTML = `<div class="empty">⚠️ ${escape(e.message)}</div>`;
      }
    }

    let toastTimer;
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
    }

    // Mark every bookmarked item as read.
    async function markAllRead() {
      if (!confirm("Marquer tous les contenus comme lus ?")) return;
      const btn = document.getElementById("readall");
      btn.disabled = true;
      try {
        const data = await fetchJSON("/api/bookmarks/read-all", { method: "POST" });
        toast(`✓ ${data.marked} contenu${data.marked > 1 ? "s" : ""} marqué${data.marked > 1 ? "s" : ""} lu`);
      } catch (err) {
        toast("Erreur : " + err.message);
      } finally {
        btn.disabled = false;
        load();
      }
    }

    document.addEventListener("click", async (e) => {
      // tag filter (card chips + tagbar chips)
      const tagBtn = e.target.closest(".tag");
      if (tagBtn && tagBtn.dataset.tag) {
        activeTag = (activeTag === tagBtn.dataset.tag) ? null : tagBtn.dataset.tag;
        applyTagFilter();
        return;
      }
      const btn = e.target.closest("button[data-action]");
      if (btn) {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        btn.disabled = true;
        try {
          // like / unlike — the server also feeds personalization prefs
          await fetchJSON(`/api/bookmarks/${id}/${action}`, { method: "POST" });
          toast(action === "like" ? "♥ Ajouté à vos préférences" : "Like retiré");
          applyLikeLocal(id, action === "like");
        } catch (err) {
          btn.disabled = false;
          toast("Erreur : " + err.message);
        }
        return;
      }
      const f = e.target.closest(".filters button");
      if (f) {
        document.querySelectorAll(".filters button").forEach(b => b.classList.toggle("active", b === f));
        currentFilter = f.dataset.filter;
        activeTag = null; // reset tag filter on view change
        load();
        return;
      }
      if (e.target.id === "refresh" || e.target.closest("#refresh")) load();
    });

    load();
    // Pas d'auto-reload : rafraîchissement manuel uniquement.
  </script>
</body>
</html>
