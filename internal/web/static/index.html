<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signets — Personal Radar</title>
  <style>
    /* ---------- base ---------- */
    :root {
      --bg: #0b0d10;
      --panel: #12151a;
      --panel-2: #1a1f26;
      --border: #20262e;
      --text: #e6e9ee;
      --muted: #98a1ad;
      --accent: #4f8ff7;
      --danger: #e5484d;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* ---------- header ---------- */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11, 13, 16, 0.92);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top));
      display: flex; flex-direction: column; gap: 10px;
    }
    .header-top { display: flex; align-items: center; gap: 8px; }
    .header-top h1 {
      font-size: 15px; font-weight: 600; margin: 0; flex: 1;
      letter-spacing: 0.01em;
    }
    .header-top h1 span { color: var(--muted); font-weight: 400; }
    #refresh {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 12px; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    #refresh:active { background: var(--panel-2); color: var(--text); }

    /* filtres = segmented control */
    .filters {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 3px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 3px;
    }
    .filters button {
      background: transparent; color: var(--muted); border: 0;
      padding: 8px 0; border-radius: 8px; font-size: 13px; font-weight: 500;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .filters button.active {
      background: var(--panel-2); color: var(--text);
    }

    /* ---------- liste ---------- */
    main { max-width: 720px; margin: 0 auto; padding: 12px 14px calc(40px + env(safe-area-inset-bottom)); }
    .summary { color: var(--muted); font-size: 12.5px; margin: 2px 2px 12px; }

    .card {
      display: flex; flex-direction: column; gap: 7px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px 11px;
      margin-bottom: 9px;
    }
    .card.read { opacity: 0.5; }
    .card.read .title { text-decoration: line-through; }
    .card.liked { border-color: rgba(229, 72, 77, 0.35); }

    .card-head { display: flex; gap: 10px; align-items: flex-start; }
    .source-icon {
      width: 34px; height: 34px; flex-shrink: 0;
      display: grid; place-items: center;
      background: var(--panel-2); border-radius: 9px;
      font-size: 17px;
    }
    .body { flex: 1; min-width: 0; }
    .title {
      font-size: 15px; font-weight: 600; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .excerpt {
      color: #aab4c0; font-size: 15px; line-height: 1.5;
    }
    .excerpt.loading { color: #6b7480; font-style: italic; }
    .excerpt.placeholder { color: #6b7480; font-style: italic; }

    /* footer: meta (source · date) on the left, actions on the right */
    .card-foot {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 4px; padding-top: 9px;
      border-top: 1px solid var(--border);
    }
    .meta {
      color: var(--muted); font-size: 12.5px;
      display: flex; align-items: center; gap: 6px;
      min-width: 0;
    }
    .meta .dot { color: #3a4350; }
    .meta .src { font-weight: 500; color: #b9c1cc; }

    /* actions: row on the right side of the footer */
    .actions {
      display: flex; gap: 6px;
      margin-left: auto; /* push to the right */
    }
    .actions button {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 14px; font-size: 12px; cursor: pointer;
      min-height: 34px; -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; gap: 5px;
    }
    .actions button:active { background: var(--panel-2); }
    .actions button.like { color: var(--accent); border-color: rgba(79,143,247,0.35); }
    .actions button.liked { color: #e5484d; border-color: rgba(229,72,77,0.45); }
    .actions .delete { color: #8a4a4d; }
    .actions .delete:active { color: var(--danger); }

    .empty { text-align: center; color: var(--muted); padding: 70px 20px; font-size: 14px; }
    .empty small { display: block; margin-top: 6px; color: #5d6672; }

    .toast {
      position: fixed; bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 18px; font-size: 13px;
      opacity: 0; pointer-events: none; transition: opacity 0.18s;
      white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; }

    /* ---------- desktop ---------- */
    @media (min-width: 640px) {
      body { font-size: 15px; }
      header { padding: 12px 24px; flex-direction: row; align-items: center; gap: 16px; }
      header .filters { width: 300px; margin-left: auto; }
      .header-top h1 { flex: 0; }
      main { padding: 20px 24px 60px; }
      .card { padding: 15px 16px 13px; }
      .title { -webkit-line-clamp: 1; }
      .actions { align-items: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Signets <span id="count"></span></h1>
      <button id="refresh" title="Rafraîchir">↻ <span class="refresh-label">Rafraîchir</span></button>
    </div>
    <div class="filters">
      <button data-filter="unread" class="active">Non lus</button>
      <button data-filter="liked">Likés</button>
      <button data-filter="all">Tous</button>
    </div>
  </header>
  <main>
    <div id="list"><div class="empty">Chargement…</div></div>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    const SOURCE_ICON = { github: "🐙", x: "🐦", reddit: "🔴", "reddit-public": "🔴", rss: "📰", linkedin: "💼" };
    const SOURCE_LABEL = { github: "GitHub", x: "X", reddit: "Reddit", "reddit-public": "Reddit", rss: "Flux RSS", linkedin: "LinkedIn" };
    const FILTER_LABEL = { unread: "non lus", liked: "likés", all: "tous" };
    let currentFilter = "unread";

    async function fetchJSON(url, opts) {
      const r = await fetch(url, opts);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    function fmtTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "à l'instant";
      if (diff < 3600) return `il y a ${Math.floor(diff / 60)} min`;
      if (diff < 86400) return `il y a ${Math.floor(diff / 3600)} h`;
      if (diff < 86400 * 7) return `il y a ${Math.floor(diff / 86400)} j`;
      return d.toLocaleDateString("fr-FR");
    }

    function escape(s) {
      return (s || "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function renderItem(b) {
      const icon = SOURCE_ICON[b.source] || "•";
      const srcLabel = SOURCE_LABEL[b.source] || b.source;
      const url = b.url || b.canonical_url || "#";
      const card = document.createElement("div");
      card.className = "card" + (b.is_liked ? " liked" : "");
      card.innerHTML = `
        <div class="card-head">
          <div class="source-icon">${icon}</div>
          <div class="body">
            <a class="title" href="${escape(url)}" target="_blank" rel="noopener">${escape(b.title || "(sans titre)")}</a>
          </div>
        </div>
        <div class="excerpt loading" id="excerpt-${b.id}">Résumé…</div>
        <div class="card-foot">
          <div class="meta">
            <span class="src">${escape(srcLabel)}</span>
            <span class="dot">·</span>
            <span>${fmtTime(b.collected_at)}</span>
          </div>
          <div class="actions">
            ${b.is_liked
              ? `<button class="liked" data-action="unlike" data-id="${b.id}">♥ Liké</button>`
              : `<button class="like" data-action="like" data-id="${b.id}">♡ Like</button>`}
            <button class="delete" data-action="delete" data-id="${b.id}">✕ Supprimer</button>
          </div>
        </div>
      `;
      return card;
    }

    async function loadSummary(id) {
      const el = document.getElementById(`excerpt-${id}`);
      try {
        const data = await fetchJSON(`/api/summary/${id}`);
        if (el) {
          el.classList.remove("loading");
          el.textContent = data.summary || "—";
        }
      } catch (e) {
        if (el) {
          el.classList.remove("loading");
          el.textContent = "Résumé indisponible";
        }
      }
    }

    async function load() {
      const list = document.getElementById("list");
      const count = document.getElementById("count");
      try {
        const data = await fetchJSON(`/api/bookmarks?filter=${currentFilter}&limit=100`);
        count.textContent = data.total ? `· ${data.total}` : "";
        if (!data.items.length) {
          list.innerHTML = `<div class="empty">Rien à afficher<small>Le prochain briefing alimentera cette liste.</small></div>`;
          return;
        }
        list.innerHTML = "";
        const frag = document.createDocumentFragment();
        for (const b of data.items) frag.appendChild(renderItem(b));
        list.appendChild(frag);
        for (const b of data.items) loadSummary(b.id);
      } catch (e) {
        list.innerHTML = `<div class="empty">⚠️ ${escape(e.message)}</div>`;
      }
    }

    let toastTimer;
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
    }

    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-action]");
      if (btn) {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === "delete" && !confirm("Supprimer définitivement ?")) return;
        btn.disabled = true;
        try {
          if (action === "delete") {
            await fetchJSON(`/api/bookmarks/${id}`, { method: "DELETE" });
            toast("Supprimé");
          } else {
            // like / unlike — the server also feeds personalization prefs
            await fetchJSON(`/api/bookmarks/${id}/${action}`, { method: "POST" });
            toast(action === "like" ? "♥ Ajouté à vos préférences" : "Like retiré");
          }
          load();
        } catch (err) {
          btn.disabled = false;
          toast("Erreur : " + err.message);
        }
        return;
      }
      const f = e.target.closest(".filters button");
      if (f) {
        document.querySelectorAll(".filters button").forEach(b => b.classList.toggle("active", b === f));
        currentFilter = f.dataset.filter;
        load();
        return;
      }
      if (e.target.id === "refresh" || e.target.closest("#refresh")) load();
    });

    load();
    // Pas d'auto-reload : rafraîchissement manuel uniquement.
  </script>
</body>
</html>
