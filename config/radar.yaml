timezone: Europe/Paris

log_level: info

database:
  host: postgres
  port: 5432
  user: radar
  password: radar
  name: radar

briefing:
  schedule: "07:00"
  max_items: 10
  max_trends: 3
  send: true

topics:
  - ai
  - coding-agents
  - software-engineering
  - devops
  - open-source
  - go
  - php
  - typescript

rss:
  enabled: true
  feeds:
    - name: AWS Application Management
      url: http://blogs.aws.amazon.com/application-management/blog/feed/recentPosts.rss
      topics: [devops, software-engineering]
    - name: Yoan Dev
      url: https://flux.yoandev.co/rss.xml
      topics: [software-engineering, php]
    - name: Hacker News Front Page
      url: https://hnrss.org/frontpage
      topics: [software-engineering, open-source, ai]
    - name: HumanCoders
      url: http://news.humancoders.com/items/feed.rss
      topics: [software-engineering, php]
    - name: Le Monde IA
      url: http://www.lemonde.fr/intelligence-artificielle/rss_full.xml
      topics: [ai]
    - name: Korben
      url: http://feeds.feedburner.com/KorbensBlog-UpgradeYourMind
      topics: [software-engineering, devops, ai]
    - name: Le Monde Sciences
      url: http://www.lemonde.fr/rss/tag/sciences.xml
      topics: [science]
    - name: Cloudflare Blog
      url: https://blog.cloudflare.com/rss/
      topics: [devops, software-engineering, ai]
    - name: Le Figaro Sciences
      url: http://www.lefigaro.fr/rss/figaro_sciences.xml
      topics: [science, ai]

reddit:
  enabled: true
  subreddits:
    - opencodeCLI
    - aiagents
    - LocalLLaMA
    - golang
    - devops
  listing: hot
  limit: 25

github:
  enabled: true
  repositories:
    - openai/openai-agents-python
    - anthropics/claude-code
    - golang/go
  organizations: []
  topics: []

x:
  enabled: true
  accounts:
    - openai
    - anthropicai
    - huggingface
  queries:
    - "coding agent"
    - "AI agent framework"

linkedin:
  enabled: true
  pages:
    - name: OpenAI
      url: https://www.linkedin.com/company/openai/
    - name: Anthropic
      url: https://www.linkedin.com/company/anthropic/

telegram:
  enabled: true

models:
  base_url: https://opencode.ai/zen/go/v1
  llm_rank: false  # Stage-2 LLM scoring is slow (1 call/item); heuristic is default
  filter:
    model: deepseek-v4-flash
  rank:
    model: deepseek-v4-flash
  synthesis:
    model: deepseek-v4-flash
  deepdive:
    model: deepseek-v4-flash

obsidian:
  enabled: true
  vault_path: /home/pi/obsidian/Hermes
